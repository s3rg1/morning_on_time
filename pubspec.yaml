name: morning_on_time
description: "Morning On Time helps families win the morning without adding anything to it."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  audioplayers: ^6.0.0
  provider: ^6.1.1
  intl: ^0.20.2
  permission_handler: ^11.1.0
  timezone: ^0.9.4
  flutter_timezone: ^3.0.0
  android_alarm_manager_plus: ^4.0.4
  flutter_tts: ^4.2.0
  confetti: ^0.7.0
  volume_controller: ^2.0.7
  firebase_core: ^4.4.0
  firebase_analytics: ^12.1.2
  firebase_crashlytics: ^5.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/
    - assets/images/streak/
